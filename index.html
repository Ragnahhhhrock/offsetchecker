<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offsetcheck — Keeping the bankers honest.</title>
<meta name="description" content="Offsetcheck independently verifies your bank's offset-account and home-loan interest calculations. Launching soon.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; background:#0C111D; color:#E4E7EC;
    font-family:"Inter", system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background-image: radial-gradient(circle at 85% 12%, rgba(249,115,22,.16), transparent 55%),
                      radial-gradient(rgba(255,255,255,.05) 1.5px, transparent 1.5px);
    background-size: auto, 56px 56px;
    text-align:center; padding:24px;
  }
  .tile { width:96px; height:96px; margin-bottom:28px; }
  h1 { font-size:clamp(40px, 8vw, 72px); font-weight:700; letter-spacing:-0.02em; color:#fff; }
  h1 .check { color:#F97316; }
  .tag { font-family:"JetBrains Mono", monospace; font-weight:500; font-size:clamp(13px, 2.4vw, 17px);
         color:rgba(255,255,255,.72); margin-top:14px; }
  .soon { margin-top:56px; font-family:"JetBrains Mono", monospace; font-size:12px; letter-spacing:3px;
          color:#FBBF24; text-transform:uppercase; }
  .rule { width:120px; height:1px; background:rgba(255,255,255,.14); margin:20px auto 0; }
  footer { position:fixed; bottom:20px; width:100%; text-align:center;
           font-family:"JetBrains Mono", monospace; font-size:11px; color:rgba(255,255,255,.35); letter-spacing:2px; }
</style>
</head>
<body>
  <svg class="tile" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Offsetcheck logo">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F97316"/>
    </linearGradient></defs>
    <rect width="96" height="96" rx="22" fill="url(#g)"/>
    <path d="M20 43 L36 59 L64 27" fill="none" stroke="#fff" stroke-opacity="0.38" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M29 52 L45 68 L73 36" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Offset<span class="check">check</span></h1>
  <p class="tag">Keeping the bankers honest.</p>
  <p class="soon">Launching soon</p>
  <div class="rule"></div>
  <footer>OFFSETCHECK.COM</footer>
</body>
</html>
